version: 2
updates:
  - package-ecosystem: nuget
    directory: /src
    schedule: { interval: weekly }
    groups:
      azure-sdk: { patterns: [ "Azure.*", "Microsoft.Azure.*" ] }
  - package-ecosystem: pip
    directory: /data
    schedule: { interval: weekly }
  - package-ecosystem: github-actions
    directory: /
    schedule: { interval: weekly }
  - package-ecosystem: docker
    directory: /src/Coaching.Api
    schedule: { interval: weekly }
